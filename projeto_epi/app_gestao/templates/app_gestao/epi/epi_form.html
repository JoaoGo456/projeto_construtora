{% extends 'app_gestao/base/base.html' %}
{% block content %}


<title>{% if form.instance.pk %}Editar EPI{% else %}Cadastrar EPI{% endif %}</title>


<h2>
    {% if form.instance.pk %}📝 Editar EPI{% else %}➕ Cadastrar EPI{% endif %}
</h2>
<a href="{% url 'epi_list' %}">Voltar para a lista</a>

<form method="post">

</form>
{% endblock content %}
