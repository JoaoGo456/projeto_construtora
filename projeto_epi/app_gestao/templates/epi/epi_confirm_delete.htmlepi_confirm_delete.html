{% extends 'base/base.html' %}
{% block content %}
    {% endblock content %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Exclusão de EPI</title>
</head>
<body>
    <h2>🗑️ Confirmar Exclusão de EPI</h2>
    <p>Você tem certeza que deseja excluir o EPI **{{ epi.nome }}** (CA: **{{ epi.ca }}**)?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sim, Excluir</button>
        <a href="{% url 'epi_list' %}">Cancelar</a>
    </form>
</body>
</html>
